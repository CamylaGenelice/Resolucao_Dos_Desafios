<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <title>Formulario</title>
</head>
<body>
    <div class="d-flex justify-content-center align-items-center vh-100">
        <form action="" class="p-4 border rounded-4 bg-info form-container" id="form">

            <h4 class="mb-4 text-center">cadastro</h4>
            <div class="col-auto">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" placeholder="Digite seu nome">
            </div>
            <div class="col-auto mt-3">
                <label for="formFile" class="form-label">Foto URL</label>
                <input type="file" class="form-control" id="formFile" placeholder="Escolher arquivo">
            </div>
            <div class="mt-3 col-auto">
                <label for="link1" class="form-label">Link da sua rede social</label>
                <input type="url" class="form-control" id="link1" name="socialLink" placeholder="Link">
            </div>
            <div class="mt-3 col-auto">
                <label for="link2" class="form-label">Link da sua rede social</label>
                <input type="url" class="form-control" id="link2" name="socialLink" placeholder="Link">
            </div>
            <div class="mt-3 col-auto">
                <button class="btn btn-dark w-100 rounded-3" type="submit" data-contexto="mudanca">enviar</button>
            </div>
            
        </form>
    </div>

</body>
</html>
